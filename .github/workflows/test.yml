name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=pc python -m unittest discover -s pc/tests -v
      - run: python -m unittest discover -s phone/tests -v
      - run: ./bluroot --help

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test and build Android release
        working-directory: phone
        run: ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest assembleRelease
